<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكالمة صوتية بسيطة</title>
    <!-- مكتبة PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- مكتبة Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; margin: 10px; }
        .call-btn { background: #4CAF50; color: white; }
        .end-btn { background: #f44336; color: white; }
        #status { margin-top: 20px; font-size: 20px; color: #ffeb3b; }
    </style>
</head>
<body>

    <h1>📞 مكالمة صوتية</h1>
    
    <!-- عشان نعرف احنا مين -->
    <div id="status">جاري تحميل النظام...</div>

    <div id="controls" style="display:none;">
        <button class="call-btn" id="callBtn">اتصل بصاحبك</button>
        <button class="end-btn" id="endBtn" style="display:none;">إنهاء المكالمة</button>
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        const socket = io();
        let peer = null;
        let currentCall = null;
        let myId = null;
        let friendId = null;

        // لما الصفحة تفتح، ننشئ PeerJS ونديها ID عشوائي
        peer = new Peer(undefined, {
            host: window.location.hostname,
            port: window.location.port === '443' ? 443 : window.location.port,
            secure: window.location.protocol === 'https:',
            path: '/peerjs',
            debug: 2
        });

        peer.on('open', (id) => {
            myId = id;
            document.getElementById('status').innerText = "متصل! جاري البحث عن صاحبك...";
            document.getElementById('controls').style.display = 'block';
            
            // انضم للغرفة
            socket.emit('join', 'room123');
        });

        // لما صاحبك يحاول يتصل بيك
        peer.on('call', (call) => {
            document.getElementById('status').innerText = "صاحبك بيتصل بيك...";
            navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then((stream) => {
                call.answer(stream); // رد عليه
                currentCall = call;
                document.getElementById('callBtn').style.display = 'none';
                document.getElementById('endBtn').style.display = 'inline-block';
                document.getElementById('status').innerText = "المكالمة شغالة...";
                
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                });
            }).catch(err => alert("لازم توافق على استخدام المايك!"));
        });

        // زرار الاتصال
        document.getElementById('callBtn').addEventListener('click', () => {
            if (!friendId) {
                alert("صاحبك لسه مفتحش اللينك، استنى شوية!");
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then((stream) => {
                const call = peer.call(friendId, stream);
                currentCall = call;

                document.getElementById('callBtn').style.display = 'none';
                document.getElementById('endBtn').style.display = 'inline-block';
                document.getElementById('status').innerText = "جاري الاتصال...";

                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    document.getElementById('status').innerText = "المكالمة شغالة...";
                });
            }).catch(err => alert("لازم توافق على استخدام المايك!"));
        });

        // زرار إنهاء المكالمة
        document.getElementById('endBtn').addEventListener('click', () => {
            if (currentCall) currentCall.close();
            document.getElementById('callBtn').style.display = 'inline-block';
            document.getElementById('endBtn').style.display = 'none';
            document.getElementById('status').innerText = "تم إنهاء المكالمة.";
        });

        // ربط الـ Signaling
        socket.on('user-joined', (id) => {
            friendId = id;
            document.getElementById('status').innerText = "صاحبك موجود! تقدر تتصل بيه دلوقتي.";
        });
    </script>
</body>
</html>
